name: CI

on:
  push:
    branches: [main, initial]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: make lint
      - run: make test
      - name: Generated code is up to date
        if: matrix.go == 'stable'
        run: make check-generated
