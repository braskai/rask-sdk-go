version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    errorlint:
      errorf: true
    revive:
      rules:
        - name: exported
          disabled: true # RaskError is the design's name for the base error, across all five SDKs.
  exclusions:
    generated: strict
    paths:
      - api/api.gen.go
    rules:
      - path: _test\.go
        linters:
          - gosec
          - bodyclose
          - errcheck
      - path: (examples|internal/cmd)/
        linters:
          - gosec
formatters:
  enable:
    - gofmt
