# oapi-codegen v2.8.2. Pinned by the //go:generate line in generate.go.
# DESIGN 11.1: always-prefix-enum-values, skip-prune, nullable-type (SDK-7); overlay sdk-go.yaml (SDK-12).
package: api
output: api/api.gen.go
generate:
  models: true
  client: true
compatibility:
  always-prefix-enum-values: true
output-options:
  skip-prune: true
  nullable-type: true
  overlay:
    path: api/sdk-go.overlay.yaml
